<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Logger</title>
    <link rel="stylesheet" href="../src/entry-editor.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="topbar">
        <div>
          <h1>Time Logger</h1>
          <div class="status-row">
            <p id="syncStatus" class="status" data-status="pending">pending</p>
            <span id="dirtyBadge" class="dirty-badge hidden" title="Unsynced local changes">0 pending</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="openCalendar" class="icon-button" title="Calendar" aria-label="Calendar" type="button">▦</button>
          <button id="headerSyncButton" class="icon-button" title="Sync now" aria-label="Sync now" type="button">↻</button>
          <button id="openOptions" class="icon-button" title="Time Logger Options" aria-label="Time Logger Options" type="button">⚙</button>
        </div>
      </header>

      <section id="activeWarning" class="warning hidden"></section>

      <section id="chatGptUsageSummary" class="chatgpt-usage-summary hidden" aria-label="ChatGPT usage">
        <span class="chatgpt-usage-label">ChatGPT usage</span>
        <span id="chatGptUsageValues" class="chatgpt-usage-values"></span>
      </section>

      <section class="window-size-section" aria-label="Window sizes">
        <div class="window-size-row">
          <span class="window-size-label">Window size</span>
          <div id="windowSizePresets" class="window-size-presets"></div>
          <button id="editWindowSizes" class="window-size-edit" title="Edit window sizes" aria-label="Edit window sizes" type="button">+</button>
        </div>
        <div id="windowSizeEditor" class="window-size-editor hidden">
          <div id="windowSizeFields" class="window-size-fields"></div>
          <div class="window-size-editor-actions">
            <button id="addWindowSize" type="button">Add</button>
            <span></span>
            <button id="saveWindowSizes" type="button">Save</button>
            <button id="cancelWindowSizes" type="button">Cancel</button>
          </div>
        </div>
      </section>

      <section class="active-panel" aria-label="No active timer">
        <div class="active-copy">
          <span class="active-label-row">
            <span class="label">Active</span>
          </span>
          <strong id="activeTitle">No task</strong>
          <span id="activeDescription" class="active-description"></span>
        </div>
        <div class="active-controls">
          <div id="elapsed" class="elapsed">00:00:00</div>
          <button id="stopButton" class="stop-active-button" type="button">■ Stop</button>
        </div>
      </section>

      <div id="newTimerDivider" class="section-divider hidden" aria-hidden="true"></div>

      <section id="newTimerSection" class="new-timer hidden">
        <button id="newTimerToggle" class="new-timer-toggle" type="button" aria-expanded="false" aria-controls="newTimerPanel">
          <span>New timer</span>
          <span class="new-timer-icon" aria-hidden="true">+</span>
        </button>
        <div id="newTimerPanel" class="new-timer-panel hidden">
          <form id="entryForm" class="entry-form">
            <label>
              Project
              <input id="project" name="project" autocomplete="off">
            </label>
            <label>
              Task
              <input id="task" name="task" autocomplete="off">
            </label>
            <label>
              Description
              <textarea id="description" name="description" rows="2"></textarea>
            </label>
            <div class="checkbox-group">
              <label class="checkbox-row">
                <input id="multiply" name="multiply" type="checkbox">
                <span>Multiply</span>
              </label>
            </div>
          </form>

          <div class="actions">
            <button id="startButton" type="button">Start</button>
          </div>
        </div>
      </section>

      <div class="section-divider" aria-hidden="true"></div>

      <section id="editPanel" class="edit-panel hidden" aria-live="polite">
        <h2 class="edit-title">
          <span id="editProjectDot" class="project-dot hidden" aria-hidden="true"></span>
          <span>Edit Entry</span>
        </h2>
        <div id="popupEntryEditor"></div>
      </section>

      <section class="recent">
        <div class="recent-heading">
          <h2>Recent Entries</h2>
        </div>
        <div id="recentEntries" class="recent-list"></div>
        <button id="loadMoreRecent" class="load-more-button hidden" type="button">Load more</button>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>

name: Release Firefox extension

on:
  push:
    tags:
      - "v*"

concurrency:
  group: firefox-pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Cloudflare test dependencies
        run: timeout 10m npm ci --prefix server/cloudflare-d1

      - name: Run deterministic Cloudflare checks
        run: >-
          node --test
          server/cloudflare-d1/test/unit.test.js
          server/cloudflare-d1/test/scaffold.test.js

      - name: Check PHP syntax and validators
        run: |
          find server/mysql-api -name '*.php' -print0 | xargs -0 -n1 php -l
          bash server/mysql-api/tests/run.sh

  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned development tooling
        run: timeout 10m npm ci

      - name: Install Firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8 # latest

      - name: Run Firefox behavior smoke
        run: timeout 10m npm run test:browser

  build-and-sign:
    needs: [browser-runtime, server-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve release version and update URL
        env:
          CONFIGURED_BASE_URL: ${{ vars.FIREFOX_UPDATE_BASE_URL }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          update_base_url="$CONFIGURED_BASE_URL"
          if [[ -z "$update_base_url" ]]; then
            repository_owner="${GITHUB_REPOSITORY_OWNER,,}"
            repository_name="${GITHUB_REPOSITORY#*/}"
            update_base_url="https://${repository_owner}.github.io/${repository_name}"
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "UPDATE_BASE_URL=${update_base_url%/}" >> "$GITHUB_ENV"

      - name: Install pinned development tooling
        run: timeout 10m npm ci

      - name: Run unit tests
        run: timeout 10m npm test

      - name: Prepare release source
        run: >-
          timeout 2m node scripts/prepare-firefox-release.mjs
          --base-url "$UPDATE_BASE_URL"
          --expected-version "$RELEASE_VERSION"
          --output web-ext-artifacts/release-source

      - name: Run JavaScript static analysis
        run: timeout 10m npm run lint:js

      - name: Lint release extension
        run: >-
          timeout 10m npm exec -- web-ext lint
          --source-dir web-ext-artifacts/release-source
          --self-hosted

      - name: Sign unlisted extension with Mozilla
        run: >-
          timeout 15m npm exec -- web-ext sign
          --source-dir web-ext-artifacts/release-source
          --artifacts-dir web-ext-artifacts/signed
          --channel unlisted
          --api-key "$WEB_EXT_API_KEY"
          --api-secret "$WEB_EXT_API_SECRET"
          --no-input

      - name: Build Firefox update site
        run: |
          mapfile -t signed_xpis < <(find web-ext-artifacts/signed -maxdepth 1 -type f -name '*.xpi')
          if [[ "${#signed_xpis[@]}" -ne 1 ]]; then
            echo "Expected exactly one signed XPI, found ${#signed_xpis[@]}" >&2
            exit 1
          fi
          timeout 2m node scripts/create-update-site.mjs \
            --base-url "$UPDATE_BASE_URL" \
            --xpi "${signed_xpis[0]}" \
            --source web-ext-artifacts/release-source \
            --output web-ext-artifacts/site

      - name: Attest signed release and update metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            web-ext-artifacts/site/*.xpi
            web-ext-artifacts/site/updates.json
            web-ext-artifacts/site/checksums.txt
            web-ext-artifacts/site/provenance.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web-ext-artifacts/site

  deploy:
    needs: build-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed extension and update feed
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

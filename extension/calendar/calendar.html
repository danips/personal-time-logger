<!doctype html>
<html lang="en" data-contrast="standard">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Logger Calendar</title>
    <link rel="stylesheet" href="../src/entry-editor.css">
    <link rel="stylesheet" href="calendar.css">
    <link rel="stylesheet" href="../src/themes.css">
    <script type="module" src="../src/themes.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <div class="brand-row">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
            </span>
            <div>
              <p class="eyebrow">Time Logger</p>
              <div class="calendar-heading-row">
                <h1>Calendar</h1>
                <p id="statusLine" class="status" data-status="pending" role="status" aria-live="polite" aria-label="Loading calendar">pending</p>
              </div>
            </div>
          </div>
        </div>
        <div class="toolbar">
          <button id="prevWeek" class="icon-button" type="button" title="Previous week" aria-label="Previous week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <label class="week-label">
            Week
            <input id="weekPicker" type="week">
          </label>
          <button id="nextWeek" class="icon-button" type="button" title="Next week" aria-label="Next week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
          <button id="todayButton" type="button">Today</button>
          <button id="addCompletedEntryButton" type="button">Add completed entry</button>
          <button id="undoCalendarButton" class="undo-calendar-button" type="button" hidden>Undo</button>
          <div class="tempo-send-control">
            <button id="sendTempoButton" type="button" title="Send the displayed week to Tempo">Send week to Tempo</button>
            <button id="tempoSendMenuButton" class="tempo-send-menu-button" type="button" title="Choose what to send" aria-label="Choose what to send to Tempo" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
            </button>
            <div id="tempoSendMenu" class="tempo-send-menu" role="menu" hidden>
              <button id="sendTempoWeekOption" type="button" role="menuitem">Send whole week</button>
              <button id="chooseTempoDaysOption" type="button" role="menuitem">Choose individual days…</button>
            </div>
          </div>
          <button id="cancelTempoButton" class="cancel-tempo-button" type="button" hidden>Cancel Tempo upload</button>
        </div>
      </header>

      <div id="calendarEditOverlay" class="edit-overlay" hidden>
        <div class="edit-popup">
          <div id="calendarEntryEditor"></div>
        </div>
      </div>

      <dialog id="tempoPreviewDialog" aria-labelledby="tempoPreviewTitle">
        <form id="tempoPreviewForm">
          <h2 id="tempoPreviewTitle">Tempo send preview</h2>
          <p id="tempoPreviewSummary" class="tempo-preview-summary"></p>
          <p id="tempoPreviewSkipped" class="tempo-preview-skipped"></p>
          <p id="tempoPreviewError" class="tempo-preview-error" role="alert" hidden></p>
          <section id="tempoPreviewMappings" class="tempo-preview-mappings" aria-label="Tempo task mappings"></section>
          <div class="tempo-preview-table-wrap">
            <table class="tempo-preview-table">
              <thead>
                <tr><th scope="col">Send</th><th scope="col">Task</th><th scope="col">Project</th><th scope="col">Day</th><th scope="col">Issue</th><th scope="col">Seconds</th><th scope="col">Hours</th><th scope="col">Submission</th></tr>
              </thead>
              <tbody id="tempoPreviewRows"></tbody>
            </table>
          </div>
          <div class="tempo-preview-actions">
            <button id="tempoPreviewCancel" type="button">Cancel</button>
            <button id="tempoPreviewConfirm" type="submit">Send selected allocations</button>
          </div>
        </form>
      </dialog>

      <section class="calendar-shell" aria-label="Weekly time log calendar">
        <div id="dayHeader" class="day-header"></div>
        <div id="calendarScroll" class="calendar-scroll">
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>
      </section>
    </main>
    <script type="module" src="calendar.js"></script>
  </body>
</html>
